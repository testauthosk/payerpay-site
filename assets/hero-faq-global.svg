<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none">
  <defs>
    <radialGradient id="ppBg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fff4f1"/>
      <stop offset="55%" stop-color="#fdeef0"/>
      <stop offset="100%" stop-color="#f6eef4"/>
    </radialGradient>
    <linearGradient id="ppGlobe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16264a"/>
      <stop offset="100%" stop-color="#0d1830"/>
    </linearGradient>
    <linearGradient id="ppCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a63"/>
      <stop offset="100%" stop-color="#ff5138"/>
    </linearGradient>
    <radialGradient id="ppGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff654d" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#ff654d" stop-opacity="0"/>
    </radialGradient>
    <filter id="ppShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0f1b33" flood-opacity="0.16"/>
    </filter>
    <filter id="ppShadowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#0f1b33" flood-opacity="0.14"/>
    </filter>
    <clipPath id="ppClip"><circle cx="560" cy="440" r="250"/></clipPath>
  </defs>

  <!-- soft brand panel -->
  <rect x="60" y="70" width="1080" height="760" rx="60" fill="url(#ppBg)"/>

  <!-- ambient coral glow behind globe -->
  <circle cx="560" cy="440" r="360" fill="url(#ppGlow)"/>

  <!-- orbit ring -->
  <ellipse cx="560" cy="440" rx="330" ry="120" stroke="#ff654d" stroke-opacity="0.30" stroke-width="2.5" stroke-dasharray="2 12" stroke-linecap="round" transform="rotate(-18 560 440)"/>

  <!-- GLOBE -->
  <g filter="url(#ppShadow)">
    <circle cx="560" cy="440" r="250" fill="url(#ppGlobe)"/>
  </g>
  <!-- graticule -->
  <g clip-path="url(#ppClip)" stroke="#3a4d74" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <ellipse cx="560" cy="440" rx="250" ry="250"/>
    <ellipse cx="560" cy="440" rx="170" ry="250"/>
    <ellipse cx="560" cy="440" rx="70" ry="250"/>
    <line x1="310" y1="440" x2="810" y2="440"/>
    <ellipse cx="560" cy="440" rx="250" ry="120"/>
    <ellipse cx="560" cy="440" rx="250" ry="205"/>
  </g>
  <!-- abstract landmasses (not real countries) -->
  <g clip-path="url(#ppClip)" fill="#33507f" fill-opacity="0.9">
    <path d="M430 330 q40 -34 92 -20 q40 12 30 52 q-10 40 -58 44 q-56 6 -74 -22 q-16 -30 10 -54 Z"/>
    <path d="M600 350 q54 -18 96 8 q30 20 8 50 q-26 34 -78 24 q-42 -8 -46 -44 q-3 -28 20 -38 Z"/>
    <path d="M470 470 q52 -14 84 18 q26 28 2 62 q-28 40 -86 30 q-48 -10 -50 -52 q-2 -46 50 -58 Z"/>
    <path d="M650 500 q40 -8 60 22 q16 28 -10 52 q-30 26 -66 8 q-30 -16 -22 -50 q6 -26 38 -34 Z"/>
  </g>
  <!-- highlight sheen -->
  <path d="M380 320 q80 -110 240 -108 q-150 40 -210 150 q-24 40 -30 -42 Z" fill="#ffffff" fill-opacity="0.06" clip-path="url(#ppClip)"/>

  <!-- destination pins spread worldwide -->
  <g>
    <g transform="translate(452 322)"><circle r="16" fill="#fff"/><circle r="9" fill="url(#ppCoral)"/></g>
    <g transform="translate(700 372)"><circle r="16" fill="#fff"/><circle r="9" fill="url(#ppCoral)"/></g>
    <g transform="translate(500 552)"><circle r="16" fill="#fff"/><circle r="9" fill="url(#ppCoral)"/></g>
    <g transform="translate(678 540)"><circle r="14" fill="#fff"/><circle r="8" fill="url(#ppCoral)"/></g>
    <g transform="translate(600 300)"><circle r="14" fill="#fff"/><circle r="8" fill="url(#ppCoral)"/></g>
  </g>
  <!-- money-flow arcs -->
  <g stroke="url(#ppCoral)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="1 11" opacity="0.85">
    <path d="M452 322 q120 -70 248 50"/>
    <path d="M500 552 q100 40 178 -12"/>
  </g>

  <!-- floating currency chips -->
  <g filter="url(#ppShadowSm)">
    <g transform="translate(214 250) rotate(-8)">
      <rect width="112" height="112" rx="28" fill="#fff"/>
      <rect x="6" y="6" width="100" height="100" rx="23" fill="none" stroke="#ffe1da" stroke-width="2"/>
      <text x="56" y="74" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#0f1b33" text-anchor="middle">$</text>
    </g>
  </g>
  <g filter="url(#ppShadowSm)">
    <g transform="translate(830 232) rotate(7)">
      <rect width="108" height="108" rx="27" fill="#fff"/>
      <rect x="6" y="6" width="96" height="96" rx="22" fill="none" stroke="#ffe1da" stroke-width="2"/>
      <text x="54" y="72" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#ff5138" text-anchor="middle">€</text>
    </g>
  </g>
  <g filter="url(#ppShadowSm)">
    <g transform="translate(196 566) rotate(6)">
      <rect width="104" height="104" rx="26" fill="#fff"/>
      <rect x="6" y="6" width="92" height="92" rx="21" fill="none" stroke="#ffe1da" stroke-width="2"/>
      <text x="52" y="70" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800" fill="#0f1b33" text-anchor="middle">£</text>
    </g>
  </g>
  <g filter="url(#ppShadowSm)">
    <g transform="translate(846 566) rotate(-7)">
      <rect width="112" height="112" rx="28" fill="#fff"/>
      <rect x="6" y="6" width="100" height="100" rx="23" fill="none" stroke="#ffe1da" stroke-width="2"/>
      <text x="56" y="75" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#0f1b33" text-anchor="middle">¥</text>
    </g>
  </g>
</svg>
